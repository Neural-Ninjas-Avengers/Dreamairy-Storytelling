<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dreamGradient" cx="50%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="cloudGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#E8F4FD;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="url(#dreamGradient)"/>
  
  <!-- Dream cloud -->
  <ellipse cx="64" cy="45" rx="35" ry="25" fill="url(#cloudGradient)"/>
  <circle cx="45" cy="50" r="18" fill="url(#cloudGradient)"/>
  <circle cx="83" cy="50" r="18" fill="url(#cloudGradient)"/>
  <circle cx="64" cy="35" r="15" fill="url(#cloudGradient)"/>
  
  <!-- AI Brain/Circuit pattern -->
  <circle cx="64" cy="45" r="12" fill="#6C5CE7" opacity="0.7"/>
  <circle cx="58" cy="40" r="2" fill="#FFFFFF"/>
  <circle cx="70" cy="40" r="2" fill="#FFFFFF"/>
  <circle cx="64" cy="50" r="2" fill="#FFFFFF"/>
  <line x1="58" y1="40" x2="64" y2="50" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
  <line x1="70" y1="40" x2="64" y2="50" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
  
  <!-- Stars around -->
  <circle cx="25" cy="25" r="2" fill="#FDCB6E" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="103" cy="30" r="1.5" fill="#FDCB6E" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="85" r="1" fill="#FDCB6E" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="108" cy="95" r="1.8" fill="#FDCB6E" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Magic wand -->
  <line x1="75" y1="75" x2="85" y2="85" stroke="#FDCB6E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="87" cy="87" r="3" fill="#FDCB6E"/>
  <circle cx="89" cy="89" r="1" fill="#FFFFFF"/>
  
  <!-- Sparkles -->
  <path d="M 90 75 L 92 77 L 94 75 L 92 73 Z" fill="#FFFFFF" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 92 75;360 92 75" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M 78 90 L 79 91 L 80 90 L 79 89 Z" fill="#FFFFFF" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 79 90;-360 79 90" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Text hint -->
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#FFFFFF" opacity="0.8">DreamAIry</text>
</svg>