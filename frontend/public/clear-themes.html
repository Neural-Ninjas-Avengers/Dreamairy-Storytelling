<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Themes - DreamAIry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        .success {
            color: #10b981;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpiar Temas</h1>
        <p>Esto eliminará todos los temas dinámicos guardados y restaurará los colores por defecto.</p>
        <button onclick="clearThemes()">Limpiar Temas</button>
        <button onclick="goHome()">Volver a la App</button>
        <div id="message"></div>
    </div>
    
    <script>
        function clearThemes() {
            try {
                localStorage.removeItem('dreamairy_theme');
                document.getElementById('message').innerHTML = '<p class="success">✅ Temas eliminados correctamente</p>';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (error) {
                document.getElementById('message').innerHTML = '<p style="color: red;">❌ Error: ' + error.message + '</p>';
            }
        }
        
        function goHome() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
